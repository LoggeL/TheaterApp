<!DOCTYPE html>
<html lang="de">
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="Termine, Drehbücher und Abstimmungen für das Kolpingtheater Ramsen.">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#E96131">
  <meta name="theater-pwa-version" content="development">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Theater-App">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Theater-App · Kolpingtheater Ramsen</title>
  <link rel="manifest" href="manifest.json">
  <!-- Start screen until Flutter's first frame (removed by pwa.js); no external resources. -->
  <style>
    html { background: #F8F6F0; }
    #theater-splash { position: fixed; inset: 0; z-index: -1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; pointer-events: none; }
    #theater-splash svg { width: 72px; height: 72px; border-radius: 12px; }
    #theater-splash .spinner { width: 32px; height: 32px; box-sizing: border-box; border: 4px solid #B83E1633; border-top-color: #B83E16; border-radius: 50%; animation: theater-spin 1s linear infinite; }
    @keyframes theater-spin { to { transform: rotate(360deg); } }
    @media (prefers-reduced-motion: reduce) { #theater-splash .spinner { animation-duration: 3s; } }
    @media (prefers-color-scheme: dark) {
      html { background: #171C19; }
      #theater-splash .spinner { border-color: #FFA58433; border-top-color: #FFA584; }
    }
  </style>
</head>
<body>
  <div id="theater-splash" aria-hidden="true">
    <svg viewBox="0 0 24 24"><rect width="24" height="24" fill="#202823"/><path fill="#E96131" d="M3,3h18v3H3z M3,6h3v14H3z M18,6h3v14h-3z M3,20h18v2H3z M12,8l-4,9h8z"/></svg>
    <div class="spinner"></div>
  </div>
  <!-- data-cfasync: Cloudflare Rocket Loader must not defer the app's own scripts. -->
  <script data-cfasync="false" src="pwa.js"></script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script data-cfasync="false" src="flutter_bootstrap.js" async></script>
</body>
</html>
