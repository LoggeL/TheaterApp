name: theater_app
description: Die native Mitglieder-App des Kolpingtheaters Ramsen.
publish_to: none
version: 0.2.0+2
environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.9
  http: ^1.5.0
  sqflite: ^2.4.2
  path: ^1.9.1
  flutter_secure_storage: ^11.1.1
  shared_preferences: ^2.5.5
  intl: ^0.20.2
  url_launcher: ^6.3.2
  app_links: ^7.0.0
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0
  share_plus: ^13.3.0
  cross_file: ^0.3.5
  pdf: ^3.11.3
  printing: ^5.14.2
  scrollable_positioned_list: ^0.3.8
  firebase_auth: ^6.6.1
  google_sign_in: ^7.2.0
dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/fonts/DejaVuSans.ttf
    - assets/fonts/DejaVuSans-Bold.ttf
    - assets/fonts/LICENSE-DejaVu.txt
