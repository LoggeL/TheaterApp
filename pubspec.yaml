name: theater_app
description: Die native Mitglieder-App des Kolpingtheaters Ramsen.
publish_to: none
version: 0.5.1+10
environment:
  sdk: '>=3.12.0 <4.0.0'
  flutter: '>=3.44.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.9
  http: ^1.5.0
  sqflite: ^2.4.2
  path: ^1.9.1
  flutter_secure_storage: ^11.1.1
  shared_preferences: ^2.5.5
  intl: ^0.20.2
  url_launcher: ^6.3.2
  app_links: ^7.0.0
  firebase_core: ^4.14.0
  firebase_messaging: ^16.6.0
  share_plus: ^13.3.0
  cross_file: ^0.3.5
  pdf: ^3.11.3
  printing: ^5.14.2
  scrollable_positioned_list: ^0.3.8
  firebase_auth: ^6.6.1
  google_sign_in: ^7.2.0
  image_picker: ^1.2.3
  file_saver: ^0.4.0
  flutter_local_notifications: ^21.0.0
  in_app_update: ^5.0.0
dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/roboto/Roboto-Thin.ttf
          weight: 100
        - asset: assets/fonts/roboto/Roboto-Light.ttf
          weight: 300
        - asset: assets/fonts/roboto/Roboto-Regular.ttf
          weight: 400
        - asset: assets/fonts/roboto/Roboto-Medium.ttf
          weight: 500
        - asset: assets/fonts/roboto/Roboto-Bold.ttf
          weight: 700
        - asset: assets/fonts/roboto/Roboto-Black.ttf
          weight: 900
        - asset: assets/fonts/roboto/Roboto-ThinItalic.ttf
          weight: 100
          style: italic
        - asset: assets/fonts/roboto/Roboto-LightItalic.ttf
          weight: 300
          style: italic
        - asset: assets/fonts/roboto/Roboto-Italic.ttf
          weight: 400
          style: italic
        - asset: assets/fonts/roboto/Roboto-MediumItalic.ttf
          weight: 500
          style: italic
        - asset: assets/fonts/roboto/Roboto-BoldItalic.ttf
          weight: 700
          style: italic
        - asset: assets/fonts/roboto/Roboto-BlackItalic.ttf
          weight: 900
          style: italic
  assets:
    - assets/brand/kolpingtheater-ramsen.png
    - assets/fonts/DejaVuSans.ttf
    - assets/fonts/DejaVuSans-Bold.ttf
    - assets/fonts/LICENSE-DejaVu.txt
    - assets/fonts/roboto/LICENSE.txt
